<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrafficFlow | Insights</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="insights-page">
    <div class="slideshow-container">
    <div class="slide slide1"></div>
    <div class="slide slide2"></div>
    <div class="slide slide3"></div>
    <div class="slide slide4"></div>
    <div class="overlay"></div> </div>
    <header>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="route-planner.html">Plan Route</a></li>
                <li><a href="insights.html" class="active">Insights</a></li>
            </ul>
        </nav>
    </header>
   <main class="planner-container">
    <section class="glass-panel insights-panel">
        <div class="panel-design-layer"></div>
        
        <div class="panel-content">
            <div class="insights-header">
                <h1>Route <br><span>Analysis.</span></h1>
                <div id="resultsDisplay">
                    <p>No route data found. Please use the Planner first.</p>
                </div>
            </div>

            <div class="insights-table-wrapper">
                <h2>Recent Trip Insights</h2>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Route</th>
                                <th>Distance</th>
                                <th>Smart Time</th>
                                <th>Weather</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>
</main>
    <script src="insights.js"></script>
</body>
</html>
